scenarios:
  - name: "Batch with Operating Unit - Create"
    steps:
      - step: "Search for existing operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner for batch test"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Batch OU Partner"
          is_company: true

      - step: "Create assignment type for batch test"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test Batch OU Type"
          code: "TBOU-01"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create batch with operating unit"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Batch OU"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert batch created with operating unit"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Generate Agreements from Batch - Operating Unit Propagation"
    steps:
      - step: "Search for existing operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1

      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner for generate test"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Generate OU Partner"
          is_company: true

      - step: "Create assignment type for generate test"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test Generate OU Type"
          code: "TGOU-01"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create batch with operating unit for generate test"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Generate OU Batch"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create generate agreement from batch wizard"
        action: "create"
        model: "generate_agreement_from_batch"
        save_as: "wizard"
        as_user: "base.user_admin"
        context:
          active_id: "EVAL: registry['batch'].id"
        values:
          batch_id: "EVAL: registry['batch'].id"
          agreement_count: 1
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Call action_generate"
        action: "call"
        target: "wizard"
        method: "action_generate"
        as_user: "base.user_admin"

      - step: "Search for the generated agreement"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
        save_as: "generated_agreement"
        expect_count: 1

      - step: "Assert generated agreement matches batch operating unit"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["id", "=", "EVAL: registry['generated_agreement'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['operating_unit'].id"]
        save_as: "matching_agreement"
        expect_count: 1

  - name: "Agreement batch_id Compute - Operating Unit Follows Batch"
    steps:
      - step: "Search for existing operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1

      - step: "Create a second operating unit distinct from the batch's"
        action: "create"
        model: "operating.unit"
        save_as: "other_operating_unit"
        values:
          name: "Test Standalone OU Secondary"
          code: "TSOU-SEC"
          partner_id: "base.main_partner"
          company_id: "base.main_company"

      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner for standalone agreement test"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Standalone OU Partner"
          is_company: true

      - step: "Create assignment type for standalone agreement test"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test Standalone OU Type"
          code: "TSOU-01"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create standalone agreement without batch"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Standalone OU Agreement"
          partner_id: "EVAL: registry['partner'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          operating_unit_id: "EVAL: registry['other_operating_unit'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert standalone agreement keeps its own operating unit"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["id", "=", "EVAL: registry['agreement'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['other_operating_unit'].id"]
        save_as: "matching_standalone"
        expect_count: 1

      - step: "Create batch with operating unit to link afterward"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Standalone OU Batch"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Link agreement to batch"
        action: "write"
        target: "agreement"
        as_user: "base.user_admin"
        values:
          batch_id: "EVAL: registry['batch'].id"

      - step: "Assert agreement operating unit now follows the batch"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["id", "=", "EVAL: registry['agreement'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['operating_unit'].id"]
        save_as: "matching_after_link"
        expect_count: 1

  - name: "Payment Term Operating Unit - Inherits from Batch via Agreement"
    steps:
