scenarios:
  - name: "Wizard only offers employees whose job matches the agreement"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test CEEA Partner Allowed"
          is_company: true

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test CEEA Allowed Type"
          code: "TCEEA001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create job A"
        action: "create"
        model: "hr.job"
        save_as: "job_a"
        values:
          name: "Test CEEA Job A - Allowed"

      - step: "Create job B"
        action: "create"
        model: "hr.job"
        save_as: "job_b"
        values:
          name: "Test CEEA Job B - Allowed"

      - step: "Create employee E1 with job A"
        action: "create"
        model: "hr.employee"
        save_as: "e1"
        values:
          name: "Test CEEA Employee E1 - Allowed"
          job_id: "REC: job_a.id"

      - step: "Create employee E2 with job B"
        action: "create"
        model: "hr.employee"
        save_as: "e2"
        values:
          name: "Test CEEA Employee E2 - Allowed"
          job_id: "REC: job_b.id"

      - step: "Create agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test CEEA Agreement Allowed"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          detail_ids:
            - - 0
              - 0
              - job_id: "REC: job_a.id"

      - step: "Confirm agreement"
        action: "call"
        target: "agreement"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Approve agreement"
        action: "call"
        target: "agreement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Create wizard"
        action: "create"
        model: "create_employee_external_assignment"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"
          employee_ids: [[6, 0, ["REC: e1.id"]]]

      - step: "Assert allowed_employee_ids contains only E1"
        action: "assert"
        target: "wizard"
        asserts:
          allowed_employee_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: e1"

