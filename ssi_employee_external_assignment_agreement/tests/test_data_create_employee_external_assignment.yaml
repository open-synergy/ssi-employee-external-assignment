          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create job A"
        action: "create"
        model: "hr.job"
        save_as: "job_a"
        values:
          name: "Test CEEA Job A - Excluded"

      - step: "Create employee E1 with job A"
        action: "create"
        model: "hr.employee"
        save_as: "e1"
        values:
          name: "Test CEEA Employee E1 - Excluded"
          job_id: "REC: job_a.id"

      - step: "Create agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test CEEA Agreement Excluded"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          detail_ids:
            - - 0
              - 0
              - job_id: "REC: job_a.id"

      - step: "Confirm agreement"
        action: "call"
        target: "agreement"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Approve agreement"
        action: "call"
        target: "agreement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Give E1 an existing open assignment on this agreement"
        action: "create"
        model: "employee_external_assignment"
        save_as: "existing_assignment"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          employee_id: "REC: e1.id"
          job_id: "REC: job_a.id"
          partner_id: "REC: partner.id"
          agreement_id: "REC: agreement.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Open the existing assignment"
        action: "call"
        target: "existing_assignment"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "existing_assignment"
        method: "invalidate_cache"

      - step: "Approve the existing assignment"
        action: "call"
        target: "existing_assignment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create wizard"
        action: "create"
        model: "create_employee_external_assignment"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"
          employee_ids: [[6, 0, ["REC: e1.id"]]]

      - step: "Assert allowed_employee_ids is empty"
        action: "assert"
        target: "wizard"
        asserts:
          allowed_employee_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  - name: "Confirm creates one draft assignment per selected employee"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test CEEA Partner Confirm"
          is_company: true

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test CEEA Confirm Type"
          code: "TCEEA003"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create job A"
        action: "create"
        model: "hr.job"
        save_as: "job_a"
        values:
          name: "Test CEEA Job A - Confirm"

      - step: "Create employee E1 with job A"
        action: "create"
        model: "hr.employee"
        save_as: "e1"
        values:
          name: "Test CEEA Employee E1 - Confirm"
          job_id: "REC: job_a.id"

      - step: "Create employee E2 with job A"
        action: "create"
        model: "hr.employee"
        save_as: "e2"
        values:
          name: "Test CEEA Employee E2 - Confirm"
          job_id: "REC: job_a.id"

      - step: "Create agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test CEEA Agreement Confirm"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          detail_ids:
            - - 0
              - 0
              - job_id: "REC: job_a.id"

      - step: "Confirm agreement"
        action: "call"
        target: "agreement"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Approve agreement"
        action: "call"
        target: "agreement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Create wizard with both employees selected"
        action: "create"
        model: "create_employee_external_assignment"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"
          employee_ids: [[6, 0, ["REC: e1.id", "REC: e2.id"]]]

      - step: "Call action_create_assignment"
        action: "call"
        target: "wizard"
        method: "action_create_assignment"
        as_user: "base.user_admin"

      - step: "Assert agreement now has two assignments"
        action: "assert"
        target: "agreement"
        refresh: true
        asserts:
          assignment_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Find the assignment created for E1"
        action: "search"
        model: "employee_external_assignment"
        domain:
          - ["agreement_id", "=", "REC: agreement.id"]
          - ["employee_id", "=", "REC: e1.id"]
        save_as: "assignment_e1"
        expect_count: 1

      - step: "Assert assignment for E1 matches its source data"
        action: "assert"
        target: "assignment_e1"
        asserts:
          state:
            type: "value"
            expected: "draft"
          job_id:
            type: "m2o"
            expected: "REC: job_a"
          type_id:
            type: "m2o"
            expected: "REC: assignment_type"
          partner_id:
            type: "m2o"
            expected: "REC: partner"

      - step: "Find the assignment created for E2"
        action: "search"
        model: "employee_external_assignment"
        domain:
          - ["agreement_id", "=", "REC: agreement.id"]
          - ["employee_id", "=", "REC: e2.id"]
        save_as: "assignment_e2"
        expect_count: 1

      - step: "Assert assignment for E2 matches its source data"
        action: "assert"
        target: "assignment_e2"
        asserts:
          state:
            type: "value"
            expected: "draft"
          job_id:
            type: "m2o"
            expected: "REC: job_a"
          type_id:
            type: "m2o"
            expected: "REC: assignment_type"
          partner_id:
            type: "m2o"
            expected: "REC: partner"

  - name: "Confirm is refused when the agreement is not Open"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test CEEA Partner Draft"
          is_company: true

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test CEEA Draft Type"
          code: "TCEEA004"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create agreement (left in Draft)"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test CEEA Agreement Draft"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create wizard"
        action: "create"
        model: "create_employee_external_assignment"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"

      - step: "action_create_assignment must refuse a non-Open agreement"
        action: "call"
        target: "wizard"
        method: "action_create_assignment"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "is not in Open state"
