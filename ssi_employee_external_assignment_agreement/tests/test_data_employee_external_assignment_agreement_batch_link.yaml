        values:
          name: "Test EEAB Link Standalone Type"
          code: "TEEABL003"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
