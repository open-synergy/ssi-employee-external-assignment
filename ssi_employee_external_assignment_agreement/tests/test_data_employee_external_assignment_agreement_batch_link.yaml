scenarios:
  - name: "Batch cascade - Confirm, Open, Done propagate to linked agreements"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Search for an existing job position"
        action: "search"
        model: "hr.job"
        domain: []
        save_as: "job"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test EEAB Link Cascade Partner"
          is_company: true

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAB Link Cascade Type"
          code: "TEEABL001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create batch"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Batch Cascade Confirm Open Done"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create first agreement linked to batch"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement_1"
        as_user: "base.user_admin"
        values:
          batch_id: "EVAL: registry['batch'].id"
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Agreement Linked 1"
          partner_id: "EVAL: registry['partner'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          detail_ids:
            - - 0
              - 0
              - job_id: "EVAL: registry['job'].id"

      - step: "Create second agreement linked to batch"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement_2"
        as_user: "base.user_admin"
        values:
          batch_id: "EVAL: registry['batch'].id"
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Agreement Linked 2"
          partner_id: "EVAL: registry['partner'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-02-01"
          date_end: "2026-11-30"
          detail_ids:
            - - 0
              - 0
              - job_id: "EVAL: registry['job'].id"

      - step: "Assert both agreements start in draft"
        action: "assert"
        target: "agreement_1"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm the batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after batch confirm"
        action: "call"
        target: "batch"
        method: "invalidate_cache"

      - step: "Assert first agreement cascaded to confirm"
        action: "assert"
        target: "agreement_1"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Assert second agreement cascaded to confirm"
        action: "assert"
        target: "agreement_2"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the batch"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after batch open"
        action: "call"
        target: "batch"
        method: "invalidate_cache"

      - step: "Assert first agreement cascaded to open"
        action: "assert"
        target: "agreement_1"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert second agreement cascaded to open"
        action: "assert"
        target: "agreement_2"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Mark the batch as done"
        action: "call"
        target: "batch"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Invalidate cache after batch done"
        action: "call"
        target: "batch"
        method: "invalidate_cache"

      - step: "Assert first agreement cascaded to done"
        action: "assert"
        target: "agreement_1"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert second agreement cascaded to done"
        action: "assert"
        target: "agreement_2"
        asserts:
          state:
            type: "value"
            expected: "done"

