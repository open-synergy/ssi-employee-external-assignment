  - name: "Employee External Assignment Agreement Batch - Compute allowed_partner_ids"
    steps:
      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create allowed partner"
        action: "create"
        model: "res.partner"
        save_as: "allowed_partner"
        values:
          name: "Test EEAB Allowed Partner"
          is_company: true

      - step: "Create assignment type restricted to manual partner"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAB Manual Partner Type"
          code: "TEEAB004"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"
          partner_selection_method: "manual"
          partner_ids:
            - - 4
              - "EVAL: registry['allowed_partner'].id"

      - step: "Create batch with restricted type"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Batch Allowed Partner"
          partner_id: "EVAL: registry['allowed_partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert allowed_partner_ids contains exactly the manual partner"
        action: "assert"
        target: "batch"
        asserts:
          allowed_partner_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
