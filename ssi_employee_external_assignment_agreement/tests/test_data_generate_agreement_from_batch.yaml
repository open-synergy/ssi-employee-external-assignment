scenarios:
  - name: "Generate agreements from batch by count"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Generate Wizard Count Partner"
          is_company: true

      - step: "Create usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        as_user: "base.user_admin"
        values:
          name: "Test Generate Wizard Usage Type"
          code: "TGAFB-USG1"
          account_id: "EVAL: registry['receivable_account'].id"

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test Generate Wizard Count Type"
          code: "TGAFB001"
          usage_id: "EVAL: registry['usage_type'].id"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create batch"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Batch For Generate By Count"
          ref1: "BATCH-REF1-001"
          ref2: "BATCH-REF2-001"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create generate wizard with agreement_count 2"
        action: "create"
        model: "generate_agreement_from_batch"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          batch_id: "EVAL: registry['batch'].id"
          agreement_count: 2
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Call action_generate"
        action: "call"
        target: "wizard"
        method: "action_generate"
        as_user: "base.user_admin"

      - step: "Assert two agreements were generated for the batch"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
        save_as: "generated"
        expect_count: 2

      - step: "Assert generated agreement snapshots ref1/ref2 from batch"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
          - ["ref1", "=", "BATCH-REF1-001"]
          - ["ref2", "=", "BATCH-REF2-001"]
        save_as: "generated_with_refs"
        expect_count: 2

      - step: "Assert generated agreement snapshots usage from assignment type"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
          - ["usage_id", "=", "EVAL: registry['usage_type'].id"]
        save_as: "generated_with_usage"
        expect_count: 2

  - name: "Generate agreements from batch by explicit lines"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Generate Wizard Lines Partner"
          is_company: true

      - step: "Create assignment type"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test Generate Wizard Lines Type"
          code: "TGAFB002"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create batch"
        action: "create"
        model: "employee_external_assignment_agreement_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test Batch For Generate By Lines"
          partner_id: "EVAL: registry['partner'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create generate wizard with two explicit lines"
        action: "create"
        model: "generate_agreement_from_batch"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          batch_id: "EVAL: registry['batch'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          line_ids:
            - - 0
              - 0
              - title: "Generated Agreement Line A"
            - - 0
              - 0
              - title: "Generated Agreement Line B"

      - step: "Call action_generate"
        action: "call"
        target: "wizard"
        method: "action_generate"
        as_user: "base.user_admin"

      - step: "Assert agreement with title from line A was generated"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
          - ["title", "=", "Generated Agreement Line A"]
        save_as: "generated_a"
        expect_count: 1

      - step: "Assert agreement with title from line B was generated"
        action: "search"
        model: "employee_external_assignment_agreement"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
          - ["title", "=", "Generated Agreement Line B"]
        save_as: "generated_b"
        expect_count: 1

      - step: "Assert generated agreement snapshots type from batch"
        action: "assert"
        target: "generated_a"
        asserts:
          type_id:
            type: "value"
            operator: "is_truthy"
