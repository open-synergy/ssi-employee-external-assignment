scenarios:
  - name: "Employee External Assignment Agreement - Full workflow: draft to open"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Search for an existing job position"
        action: "search"
        model: "hr.job"
        domain: []
        save_as: "job"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test EEAA Partner"
          is_company: true

      - step: "Create assignment type for agreement"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAA Agreement Type"
          code: "TAAT001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create external assignment agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test External Assignment Agreement"
          partner_id: "EVAL: registry['partner'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          detail_ids:
            - - 0
              - 0
              - job_id: "EVAL: registry['job'].id"

      - step: "Assert agreement created in draft"
        action: "assert"
        target: "agreement"
        asserts:
          state:
            type: "value"
            expected: "draft"
          title:
            type: "value"
            expected: "Test External Assignment Agreement"

      - step: "Confirm agreement"
        action: "call"
        target: "agreement"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Approve agreement"
        action: "call"
        target: "agreement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Mark agreement as done"
        action: "call"
        target: "agreement"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

