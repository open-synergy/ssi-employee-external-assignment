            operator: "is_truthy"

  - name: "Agreement Input Type - default_amount and onchange amount"
    steps:
      - step: "Create input type without default_amount"
        action: "create"
        model: "employee_external_assignment_agreement_input_type"
        save_as: "input_type_no_default"
        values:
          name: "Test Input Type No Default"
          code: "TITNOD001"

      - step: "Assert input type created with zero default_amount"
        action: "assert"
        target: "input_type_no_default"
        asserts:
          default_amount:
            type: "value"
            expected: 0.0

      - step: "Create input type with default_amount"
        action: "create"
        model: "employee_external_assignment_agreement_input_type"
        save_as: "input_type_with_default"
        values:
          name: "Test Input Type With Default"
          code: "TITWD001"
          default_amount: 500000.0

      - step: "Assert input type created with correct default_amount"
        action: "assert"
        target: "input_type_with_default"
        asserts:
          default_amount:
            type: "value"
            expected: 500000.0

      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
