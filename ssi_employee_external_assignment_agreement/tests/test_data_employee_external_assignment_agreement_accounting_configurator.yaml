setup:
  steps:
    - step: "Search for an existing account journal"
      action: "search"
      model: "account.journal"
      domain:
        - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
      save_as: "journal"
      limit: 1

    - step: "Search for an existing receivable account"
      action: "search"
      model: "account.account"
      domain:
        - ["user_type_id.type", "=", "receivable"]
      save_as: "receivable_account"
      limit: 1

    - step: "Search for a generic account type"
      action: "search"
      model: "account.account.type"
      domain:
        - ["type", "=", "other"]
      save_as: "account_type_other"
      limit: 1

    - step: "Search for an existing currency"
      action: "search"
      model: "res.currency"
      domain:
        - ["active", "in", [true, false]]
      save_as: "currency"
      limit: 1

    - step: "Search for an existing pricelist"
      action: "search"
      model: "product.pricelist"
      domain: []
      save_as: "pricelist"
      limit: 1

    - step: "Create partner"
      action: "create"
      model: "res.partner"
      save_as: "partner"
      values:
        name: "Test EEAA Accounting Config Partner"
        is_company: true

scenarios:
  - name:
      "Accounting Configurator - Manual receivable account restricts
      allowed_receivable_account_ids"
    steps:
      - step: "Create assignment type with manual receivable account"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAA Manual Receivable Account Type"
          code: "TEEAACC001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"
          receivable_account_selection_method: "manual"
          receivable_account_ids:
            - - 4
              - "REC: receivable_account.id"

      - step: "Create agreement using the restricted type"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test Manual Receivable Account Agreement"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert allowed_receivable_account_ids exactly the manual account"
        action: "assert"
        target: "agreement"
        asserts:
          allowed_receivable_account_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: receivable_account"

