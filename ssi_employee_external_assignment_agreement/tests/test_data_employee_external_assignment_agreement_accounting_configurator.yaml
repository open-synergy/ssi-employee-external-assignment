  - name:
      "Accounting Configurator - Domain receivable account matches every record found by
      the domain"
    steps:
      - step: "Create first domain-matched receivable account"
        action: "create"
        model: "account.account"
        save_as: "domain_account_1"
        values:
          name: "EEA CFG Domain Account A"
          code: "EEACD001"
          user_type_id: "REC: account_type_other.id"

      - step: "Create second domain-matched receivable account"
        action: "create"
        model: "account.account"
        save_as: "domain_account_2"
        values:
          name: "EEA CFG Domain Account B"
          code: "EEACD002"
          user_type_id: "REC: account_type_other.id"

      - step: "Create assignment type with domain-based receivable account filter"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAA Domain Receivable Account Type"
          code: "TEEAACC005"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"
          receivable_account_selection_method: "domain"
          receivable_account_domain: "[('name', 'ilike', 'EEA CFG Domain')]"

      - step: "Create agreement using the domain-restricted type"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test Domain Receivable Account Agreement"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step:
          "Assert allowed_receivable_account_ids contains both domain-matched accounts"
        action: "assert"
        target: "agreement"
        asserts:
          allowed_receivable_account_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: domain_account_1"
              - "REC: domain_account_2"

  - name: "Accounting Configurator - Empty type_id yields no allowed accounting records"
    skip_setup: true
    steps:
      - step: "Build a new agreement form without setting type_id"
        action: "form"
        model: "employee_external_assignment_agreement"
        save: false
        asserts:
          allowed_receivable_account_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          allowed_journal_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          allowed_usage_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          allowed_analytic_group_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
