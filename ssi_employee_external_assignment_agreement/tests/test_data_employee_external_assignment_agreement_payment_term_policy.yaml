options:
  auto_refresh: true

scenarios:
  - name:
      "Payment Term - terminate_ok/restart_approval_ok reach real states (draft/confirm)"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test EEAA Policy Partner"
          is_company: true

      - step: "Create assignment type for agreement"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAA Policy Type"
          code: "TEEAPT001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create external assignment agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test Agreement For Payment Term Policy"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create payment term for agreement"
        action: "create"
        model: "employee_external_assignment_agreement.payment_term"
        save_as: "payment_term"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert payment term created in draft"
        action: "assert"
        target: "payment_term"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Terminate is not available while draft (state never reaches 'open')"
        action: "assert"
        target: "payment_term"
        asserts:
          terminate_ok:
            type: "value"
            expected: false

      - step: "Restart Approval is not available while draft"
        action: "assert"
        target: "payment_term"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: false

      - step: "action_terminate must be rejected while draft"
        action: "call"
        target: "payment_term"
        method: "action_terminate"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

      - step: "Confirm payment term"
        action: "call"
        target: "payment_term"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Terminate is still not available while confirm"
        action: "assert"
        target: "payment_term"
        asserts:
          terminate_ok:
            type: "value"
            expected: false

      - step: "action_terminate must still be rejected while confirm"
        action: "call"
        target: "payment_term"
        method: "action_terminate"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

  - name:
      "Payment Term - terminate_ok/restart_approval_ok active once done,
      action_terminate reaches 'terminate' state"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test EEAA Policy Partner Done"
          is_company: true

      - step: "Create assignment type for agreement"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test EEAA Policy Type Done"
          code: "TEEAPT002"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"

      - step: "Create external assignment agreement"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "REC: assignment_type.id"
          title: "Test Agreement For Payment Term Policy Done"
          partner_id: "REC: partner.id"
          receivable_account_id: "REC: receivable_account.id"
          journal_id: "REC: journal.id"
          currency_id: "REC: currency.id"
          pricelist_id: "REC: pricelist.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create payment term for agreement"
        action: "create"
        model: "employee_external_assignment_agreement.payment_term"
        save_as: "payment_term"
        as_user: "base.user_admin"
        values:
          agreement_id: "REC: agreement.id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Confirm payment term"
        action: "call"
        target: "payment_term"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step:
          "Approve payment term (no approval template configured, so it goes straight to
          done)"
        action: "call"
        target: "payment_term"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Terminate is available once done"
        action: "assert"
        target: "payment_term"
        asserts:
          terminate_ok:
            type: "value"
            expected: true

      - step: "Restart Approval is available once done (no approval_template_id set)"
        action: "assert"
        target: "payment_term"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: true

      - step: "Terminate the payment term"
        action: "call"
        target: "payment_term"
        method: "action_terminate"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "terminate"
