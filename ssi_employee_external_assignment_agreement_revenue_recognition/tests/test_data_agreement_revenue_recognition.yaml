scenarios:
  - name: "action_create_pob creates performance obligation from agreement detail"
    steps:
      - step: "Search for an existing account journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "in", ["general", "sale", "purchase", "bank", "cash"]]
        save_as: "journal"
        limit: 1

      - step: "Search for an existing receivable account"
        action: "search"
        model: "account.account"
        domain:
          - ["user_type_id.type", "=", "receivable"]
        save_as: "receivable_account"
        limit: 1

      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing pricelist"
        action: "search"
        model: "product.pricelist"
        domain: []
        save_as: "pricelist"
        limit: 1

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test RR Partner"
          is_company: true

      - step: "Create service product template for pob_product_id"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl"
        values:
          name: "Test RR POB Service"
          type: "service"

      - step: "Get product.product from template"
        action: "search"
        model: "product.product"
        domain:
          - ["product_tmpl_id", "=", "EVAL: registry['product_tmpl'].id"]
        save_as: "service_product"
        limit: 1

      - step: "Create hr.job"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "Test RR Job Position"

      - step: "Create assignment type with pob_product_id"
        action: "create"
        model: "employee_external_assignment_type"
        save_as: "assignment_type"
        values:
          name: "Test RR Assignment Type"
          code: "TRRAT001"
          employee_selection_method: "domain"
          employee_domain: "[]"
          job_selection_method: "domain"
          job_domain: "[]"
          salary_rule_selection_method: "domain"
          salary_rule_domain: "[]"
          other_fee_category_selection_method: "domain"
          other_fee_category_domain: "[]"
          other_fee_selection_method: "domain"
          other_fee_domain: "[]"
          pob_product_id: "EVAL: registry['service_product'].id"

      - step: "Create agreement in draft"
        action: "create"
        model: "employee_external_assignment_agreement"
        save_as: "agreement"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['assignment_type'].id"
          title: "Test RR Agreement"
          partner_id: "EVAL: registry['partner'].id"
          receivable_account_id: "EVAL: registry['receivable_account'].id"
          journal_id: "EVAL: registry['journal'].id"
          currency_id: "EVAL: registry['currency'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Create agreement detail with job position"
        action: "create"
        model: "employee_external_assignment_agreement.detail"
        save_as: "detail"
        values:
          agreement_id: "EVAL: registry['agreement'].id"
          job_id: "EVAL: registry['job'].id"
          quantity: 1

      - step: "Confirm agreement"
        action: "call"
        target: "agreement"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Approve agreement to open state"
        action: "call"
        target: "agreement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "agreement"
        method: "invalidate_cache"

      - step: "Assert analytic_account_id was created on open"
        action: "assert"
        target: "agreement"
        asserts:
          analytic_account_id:
            type: "value"
            operator: "is_truthy"

      - step: "Call action_create_pob on detail"
        action: "call"
        target: "detail"
        method: "action_create_pob"

      - step: "Invalidate cache on detail after pob creation"
        action: "call"
        target: "detail"
        method: "invalidate_cache"

      - step: "Assert pob_id is set on detail"
        action: "assert"
        target: "detail"
        asserts:
          pob_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert agreement_detail_id is set on created pob"
        action: "assert"
        target: "detail"
        asserts:
          pob_id:
            type: "value"
            operator: "is_truthy"

      - step: "Search created performance obligation"
        action: "search"
        model: "performance_obligation"
        domain:
          - ["agreement_detail_id", "=", "EVAL: registry['detail'].id"]
        save_as: "pob"
        limit: 1
        expect_count: 1

      - step: "Assert pob has correct revenue recognition timing"
        action: "assert"
        target: "pob"
        asserts:
          revenue_recognition_timing:
            type: "value"
            expected: "over_time"
          progress_completion_method:
            type: "value"
            expected: "input"
          fulfillment_field_id:
            type: "value"
            operator: "is_truthy"

  - name: "qty_payslip_fulfillment is zero when no payslip lines linked"
    steps:
      - step: "Search for an existing currency"
        action: "search"
        model: "res.currency"
        domain:
          - ["active", "in", [true, false]]
        save_as: "currency"
        limit: 1

      - step: "Search for an existing UOM"
        action: "search"
        model: "uom.uom"
        domain: []
        save_as: "uom"
        limit: 1

      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test RR Analytic Account"

      - step: "Create service product for pob"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl"
        values:
          name: "Test RR Fulfillment Service"
          type: "service"

      - step: "Get product.product from template"
        action: "search"
        model: "product.product"
        domain:
          - ["product_tmpl_id", "=", "EVAL: registry['product_tmpl'].id"]
        save_as: "pob_product"
        limit: 1

      - step: "Create performance obligation"
        action: "create"
        model: "performance_obligation"
        save_as: "pob"
        values:
          source_analytic_account_id: "EVAL: registry['analytic_account'].id"
          title: "Test POB for Fulfillment"
          product_id: "EVAL: registry['pob_product'].id"
          currency_id: "EVAL: registry['currency'].id"
          uom_id: "EVAL: registry['uom'].id"
          uom_quantity: 0.0
          price_unit: 1.0
          progress_completion_method: "input"
          revenue_recognition_timing: "over_time"

      - step: "Create partner for acceptance"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test RR Fulfillment Partner"
          is_company: true

      - step: "Create performance obligation acceptance without payslip lines"
        action: "create"
        model: "performance_obligation_acceptance"
        save_as: "acceptance"
        values:
          performance_obligation_id: "EVAL: registry['pob'].id"
          partner_id: "EVAL: registry['partner'].id"
          date: "2026-01-31"
          date_start: "2026-01-01"
          date_end: "2026-01-31"

      - step: "Assert qty_payslip_fulfillment is zero with no payslip lines"
        action: "assert"
        target: "acceptance"
        asserts:
          qty_payslip_fulfillment:
            type: "value"
            expected: 0.0
          payslip_line_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
